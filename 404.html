<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Célia Quadrado</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1ec">

  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f4f1ec; color: #1b1a17; font-family: 'Instrument Sans', system-ui, sans-serif; text-align: center; }

    .label { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #645f55; margin-bottom: 18px; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 8vw, 84px); line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 32px; }
    h1 em { color: #b5603c; }
    a { display: inline-block; padding: 15px 26px; border-radius: 999px; background: #a8522e; color: #fff; text-decoration: none; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    a:hover { background: #1b1a17; }
    a:focus-visible { outline: 2px solid #a8522e; outline-offset: 3px; }
  </style>
</head>

  <main>
    <p class="label">Erreur 404</p>
